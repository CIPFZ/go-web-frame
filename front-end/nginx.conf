server {
    listen       80;
    server_name  localhost;

    # 首屏 JS 有几 MB：压缩后约为三分之一。nginx 默认不压缩经代理（带 Via 头）的请求，所以要 gzip_proxied any
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /ready {
        proxy_pass http://backend:8080/ready;
    }

    location = /health {
        proxy_pass http://backend:8080/health;
    }

    location ^~ /uploads/file/ {
        alias /srv/uploads/file/;
        autoindex off;
        add_header X-Content-Type-Options nosniff;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    location /observability/ {
        set $grafana_upstream grafana:3000;
        proxy_pass http://$grafana_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache"; # index.html 每次向服务器确认，部署后立即拿到新版本
    }

    # 构建产物文件名带内容哈希（config.ts 的 hash: true），内容变了文件名就变，可以长期缓存
    location ~* "\.[0-9a-f]{8}\.(js|css)$" {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Swagger docs
    location /api/v1/swagger/ {
        proxy_pass http://backend:8080/api/v1/swagger/;
        proxy_set_header Host $host;
    }
}
