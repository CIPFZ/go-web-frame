name: nexus-cms

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nexus_cms
      MYSQL_USER: nexus_cms
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run init.py first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run init.py first}
      TZ: Asia/Shanghai
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -unexus_cms -D nexus_cms -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      start_period: 45s
      retries: 30
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run init.py first}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDISCLI_AUTH"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  backend:
    image: nexus-cms-backend:local
    build:
      context: ../../backend
    restart: unless-stopped
    init: true
    environment:
      CMS_CONFIG_PATH: /app/configs/local.yaml
      SEED_ADMIN_ENABLED: 'true'
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run init.py first}
      SEED_ADMIN_AUTHORITY_ID: '1'
      SEED_ADMIN_DEFAULT_ROUTER: dashboard/workplace
      TZ: Asia/Shanghai
    ports:
      - '127.0.0.1:${CMS_API_PORT:-18081}:8080'
    volumes:
      - ./runtime/backend.yaml:/app/configs/local.yaml:ro
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    logging: *logging

  frontend:
    image: nexus-cms-frontend:local
    build:
      context: ../../front-end
    restart: unless-stopped
    ports:
      - '${CMS_BIND_ADDRESS:-0.0.0.0}:${CMS_WEB_PORT:-8080}:80'
    volumes:
      - uploads:/srv/uploads:ro
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

volumes:
  mysql-data:
  redis-data:
  uploads:
