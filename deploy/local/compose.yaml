name: nexus-cms

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  migrator:
    image: my-cms-backend:latest
    entrypoint: ["./migrate", "-f", "/app/configs/local.yaml"]
    environment:
      CMS_CONFIG_PATH: /app/configs/local.yaml
      SEED_ADMIN_ENABLED: 'true'
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run init.py first}
      SEED_ADMIN_AUTHORITY_ID: '1'
      SEED_ADMIN_DEFAULT_ROUTER: dashboard/workplace
      TZ: Asia/Shanghai
    volumes:
      - ./runtime/backend.yaml:/app/configs/local.yaml:ro
    logging: *logging

  backend:
    image: my-cms-backend:latest
    build:
      context: ../../backend
    restart: unless-stopped
    init: true
    environment:
      CMS_CONFIG_PATH: /app/configs/local.yaml
      TZ: Asia/Shanghai
      LIBVIRT_URI: qemu:///system
      AGENT_GATEWAY_URL: ${AGENT_GATEWAY_URL:-}
      AGENT_GATEWAY_TOKEN: ${AGENT_GATEWAY_TOKEN:-}
    ports:
      - '127.0.0.1:${CMS_API_PORT:-18081}:8080'
    volumes:
      - ./runtime/backend.yaml:/app/configs/local.yaml:ro
      - uploads:/app/uploads
      - /run/libvirt/libvirt-sock:/run/libvirt/libvirt-sock
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      - default
      - common-services
    stop_grace_period: 30s
    logging: *logging

  frontend:
    image: my-cms-frontend:latest
    build:
      context: ../../front-end
    restart: unless-stopped
    ports:
      - '${CMS_BIND_ADDRESS:-0.0.0.0}:${CMS_WEB_PORT:-8080}:80'
    volumes:
      - uploads:/srv/uploads:ro
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

volumes:
  uploads:

networks:
  common-services:
    external: true
