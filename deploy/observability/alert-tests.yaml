rule_files: [alerts.yaml]
evaluation_interval: 15s
tests:
  - interval: 15s
    input_series:
      - series: 'up{job="cms"}'
        values: '1 0 0 0 0 0 1 1 1'
      - series: 'httpcheck_status{http_status_code="200"}'
        values: '1 0 0 0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 1m15s
        alertname: CMSCollectorUnavailable
        exp_alerts:
          - exp_labels: {job: cms, severity: critical}
            exp_annotations: {summary: 'CMS telemetry collector is unreachable'}
      - eval_time: 1m15s
        alertname: CMSNotReady
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: 'CMS dependency readiness check failed'}
      - eval_time: 2m
        alertname: CMSCollectorUnavailable
        exp_alerts: []
      - eval_time: 2m
        alertname: CMSNotReady
        exp_alerts: []
