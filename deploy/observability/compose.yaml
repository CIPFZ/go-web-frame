# Optional overlay: docker compose ... -f deploy/observability/compose.yaml up -d
x-observability-logging: &observability-logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ['--config=/etc/otelcol/config.yaml']
    logging: *observability-logging
    restart: unless-stopped
    mem_limit: 512m
    volumes: ['../observability/collector.yaml:/etc/otelcol/config.yaml:ro']
  prometheus:
    image: prom/prometheus:v3.14.0
    command: ['--config.file=/etc/prometheus/prometheus.yaml', '--storage.tsdb.retention.time=14d', '--storage.tsdb.retention.size=1GB']
    logging: *observability-logging
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - '../observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro'
      - '../observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro'
      - prometheus-data:/prometheus
  loki:
    image: grafana/loki:3.7.7
    command: ['-config.file=/etc/loki/config.yaml']
    logging: *observability-logging
    restart: unless-stopped
    mem_limit: 512m
    volumes: ['../observability/loki.yaml:/etc/loki/config.yaml:ro', 'loki-data:/loki']
  tempo:
    image: grafana/tempo:2.9.5
    command: ['-config.file=/etc/tempo/config.yaml']
    logging: *observability-logging
    restart: unless-stopped
    mem_limit: 512m
    volumes: ['../observability/tempo.yaml:/etc/tempo/config.yaml:ro', 'tempo-data:/var/tempo']
  grafana:
    image: grafana/grafana:13.2.1
    logging: *observability-logging
    restart: unless-stopped
    mem_limit: 512m
    environment:
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s/observability/'
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run init.py first}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - '../observability/grafana/provisioning:/etc/grafana/provisioning:ro'
      - '../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro'
      - grafana-data:/var/lib/grafana
volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
